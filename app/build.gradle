plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fde.gallery'
    compileSdk 34

    lintOptions {
        abortOnError false
        checkAllWarnings false
        checkReleaseBuilds false
        lintConfig file("path/to/custom/lint.xml")
    }

    testOptions {
        unitTests.all {
            enabled = false
            ignoreFailures = true
        }
    }

    ext {
        appVersion = project.findProperty('appVersion') ?: "2.1.0"
    }
    version = appVersion
    defaultConfig {
        applicationId "com.android.gallery3d"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(new Date().format("yyyyMMdd"))
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        resources {
            excludes += "META-INF/beans.xml"
        }
    }

    signingConfigs {
        release {
            storeFile file("../openfde.jks")
            storePassword "keyforcat"
            keyAlias "rootcloud"
            keyPassword "keyforcat"
        }
    }
    // ...
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }

        debug {
            applicationIdSuffix
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FdeGallery.apk"
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"

    api project(':imageeditlibrary')
    api project(':dlna')
    implementation 'com.google.android.exoplayer:exoplayer:2.13.3'
    implementation group: 'com.github.bumptech.glide', name: 'glide', version: '5.0.4'
    implementation files('libs/baselib.aar')
    compileOnly files('libs/openfde_sdk.jar')



    implementation("com.github.wseemann:FFmpegMediaMetadataRetriever:1.0.14")
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}